name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Set up release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; signing with a throwaway debug key, so this build won't install as an update over earlier ones."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk suikaween.apk

      - uses: actions/upload-artifact@v4
        with:
          name: suikaween-apk
          path: suikaween.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      # Pushes to the default branch publish a GitHub Release. The newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/suikaween.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Suikaween build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: suikaween.apk
          make_latest: true
          body: |
            Built from ${{ github.sha }}.
            Install `suikaween.apk` on your phone (allow installs from unknown sources the first time).
